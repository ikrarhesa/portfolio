<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("hesa_theme") === "dark" ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <!-- The page is pre-rendered, so without this a first-time visitor would see the home page flash before the
         intro covers it. Mirror of shouldPlayIntro() in src/App.tsx: hide until React mounts (it removes the
         class). The CSS animation un-hides it after 3s in case the script never loads. Readers that don't run
         JavaScript never get the class, so they always see the content. -->
    <script>
      (function () {
        try {
          var l = window.location;
          var bot = navigator.webdriver === true || /bot|crawl|spider|slurp|preview|headless|lighthouse|gpt|claude|perplexity|anthropic|openai/i.test(navigator.userAgent);
          var forced = /(^|[?&])intro([=&]|$)/.test(l.search);
          var seen = parseInt(localStorage.getItem("hesa_intro_seen") || "", 10);
          var stale = !isFinite(seen) || Date.now() - seen > 7 * 24 * 60 * 60 * 1000;
          if (forced || (!bot && l.pathname === "/" && l.hash.length <= 1 && stale)) {
            document.documentElement.classList.add("intro-pending");
          }
        } catch (e) {
          if (location.pathname === "/") document.documentElement.classList.add("intro-pending");
        }
      })();
    </script>
    <!-- Mirror of readLang() in src/i18n: a stored or ?lang=ja choice sets <html lang> straight away and hides the
         English pre-rendered page until React mounts in Japanese (same 3s safety net as above). -->
    <script>
      (function () {
        try {
          var m = /[?&]lang=(ja|en)(&|$)/.exec(location.search);
          var l = m ? m[1] : localStorage.getItem("hesa_lang");
          if (l === "ja") {
            document.documentElement.lang = "ja";
            document.documentElement.classList.add("lang-pending");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      @keyframes intro-unhide { to { visibility: visible; } }
      .intro-pending #root, .lang-pending #root { visibility: hidden; animation: intro-unhide 0s 3s forwards; }
    </style>
